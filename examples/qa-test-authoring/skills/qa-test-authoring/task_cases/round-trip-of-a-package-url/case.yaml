id: round-trip-of-a-package-url

# The case for references/property-based-testing.md — the round-trip pattern, and its warning that
# "generators must produce valid domain objects ... but keep hostile shapes in range". The mutants
# are chosen so the second half of that sentence is what decides the score: a round-trip asserted
# over three friendly inputs kills almost nothing here, because every interesting bug lives in the
# shapes an author does not think to type (a namespace with a slash in it, an absent one).
#
# It is also the case that shows a round-trip alone is not enough. `namespace-always-emitted`
# changes the wire format and still round-trips perfectly, so only an example test that asserts the
# actual string catches it — which is why that page says properties *complement* example tests
# rather than replacing them.
instruction: >
  Write pytest tests for purl.py in this workspace. Only pytest is available — the environment has
  no hypothesis, no external test packages, and no network, so state any invariant as an ordinary
  parameterised or looped test over inputs you choose. Put the tests in test_purl.py and do not
  modify purl.py.

verify:
  mutants:
    - id: namespace-loses-its-first-segment
      file: purl.py
      find: "namespace, _, name = path.rpartition(\"/\")"
      replace: "namespace, _, name = path.partition(\"/\")"
      describes: >
        a namespace containing a slash ("github.com/acme") splits at the wrong end, so the name
        becomes "acme/ledger" — survives every round-trip asserted over single-segment namespaces

    - id: namespace-always-emitted
      file: purl.py
      find: "path = f\"{namespace}/{name}\" if namespace else name"
      replace: "path = f\"{namespace}/{name}\""
      describes: >
        an absent namespace is emitted as an empty segment ("pkg:npm//left-pad@1.3.0"), which still
        round-trips — killed only by an example test asserting the serialized string itself

    - id: nameless-purl-accepted
      file: purl.py
      find: "if not type_ or not name:"
      replace: "if not type_:"
      describes: >
        a package URL with no name serializes to "pkg:maven/@1.0.0" instead of raising — the
        validation path nobody writes a test for

    - id: missing-version-returns-garbage
      file: purl.py
      find: "if not body:"
      replace: "if not version:"
      describes: >
        a string with no "@" parses into four empty-ish fields instead of raising MalformedPurl —
        killed by asserting the error path, not just the happy one
