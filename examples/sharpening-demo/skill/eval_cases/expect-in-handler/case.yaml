# The first thing v1 misses: its guidance names `.unwrap()` and nothing else, so a reviewer
# applying it literally has no reason to object to `.expect()` — which panics identically.
id: expect-in-handler
kind: should_catch
repo: "gitlab:acme/payments"
change: change.diff
provenance:
  source: gitlab_mr
  ref: "acme/payments!povr-903"
  human_signal: "suggestion applied"
expect:
  - id: e1
    must: appear
    where:
      path: src/handlers/refund.rs
      line_range: [22, 26]
    semantic: "expect() panics when the refund row is missing, exactly as unwrap() would"
