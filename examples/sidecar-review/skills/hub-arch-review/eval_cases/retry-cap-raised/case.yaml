# Sidecar-dependent, and the sharp one: R2 asks for a bounded retry with a named cap, and this
# change *is* a bounded retry with a named cap. Without `payments/gateway/.agents/arch-review.md`
# the diff reads as compliant — the reason 3 is a ceiling lives in the upstream's rate limit.
id: retry-cap-raised
kind: should_catch
repo: "gitlab:acme/hub"
change: change.diff
provenance:
  source: gitlab_mr
  ref: "acme/hub!4903"
  human_signal: "reverted; the merchant account was blocked for 30 minutes in staging"
expect:
  - id: e1
    must: appear
    where:
      path: payments/gateway/stripe.py
      line_range: [5, 6]
    semantic: "raises MAX_RETRIES above the number of attempts the card processor tolerates"
    severity_min: warning
