[project]
name = "whetstone"
version = "0.1.0"
description = "Continuous skill-sharpening system — eval/backtest harness (M1)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "httpx>=0.27",
    "anthropic>=0.40",
]

[project.optional-dependencies]
# The console. Kept optional so the core CLI, and CI, stay lean.
ui = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "whetstone[ui]",
]

[project.scripts]
whetstone = "whetstone.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whetstone"]
# The built SPA is generated and gitignored; force-include it so wheels ship a console that runs
# without Node. Maintainers build it with `npm run build` in ui/.
artifacts = ["src/whetstone/ui/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    # Starlette's TestClient prefers httpx2. The GitLab connector and its respx cassettes are built
    # on httpx 0.x, so the tree stays there rather than carrying two HTTP clients.
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "anthropic.*"
ignore_missing_imports = true
